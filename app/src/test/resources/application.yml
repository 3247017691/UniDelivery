spring:
  datasource:
    url: jdbc:h2:mem:uni_delivery;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mapi:
  base-url: http://localhost:${wiremock.port:8089}
  per-advertiser-qps: 1000
  global-qps: 1000
  max-retries: 2
  retry-backoff-ms: 10
  retryable-codes: [40100]
  paths: {}

unidelivery:
  app-id: test-app
  app-secret: test-secret
  chunk-size: 200
  reconcile-threshold: 0.01
  spi-secret: test-spi-secret
  spi-verifier: hmacSha256SpiVerifier
  reports:
    - topic: UNI_PROJECT_DATA
      dimensions: [project_id, stat_time]
      metrics: [stat_cost]
      granularity: HOUR
  jobs:
    enabled: false