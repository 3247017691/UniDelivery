spring:
  application:
    name: uni-delivery
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/uni_delivery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:uni_delivery}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

mapi:
  base-url: ${MAPI_BASE_URL:https://api.oceanengine.com}
  connect-timeout-ms: 5000
  request-timeout-ms: 30000
  per-advertiser-qps: 5
  global-qps: 20
  max-retries: 3
  retry-backoff-ms: 500
  # 限流/瞬时错误码（官方附录核实）：40100 系统级 / 40110 开发者秒级 / 40130 账户级 QPS
  retryable-codes: [40100, 40110, 40130, 50000]
  # path 覆盖（uni_project/oc_project 迁移与待核实接口）：KEY=路径
  paths: {}

unidelivery:
  app-id: ${MAPI_APP_ID:}
  app-secret: ${MAPI_APP_SECRET:}
  chunk-size: 200
  reconcile-threshold: 0.01
  spi-secret: ${SPI_SECRET:}
  # 验签算法实现 bean 名；契约核实前默认 reject-all，绝不裸收推送
  spi-verifier: rejectAllSpiVerifier
  alert-webhook-url: ${ALERT_WEBHOOK_URL:}
  jobs:
    enabled: true
    token-refresh-ms: 300000
    review-poll-ms: 60000
    upload-poll-ms: 30000
    report-pull-cron: "0 30 1 * * *"
    reconcile-cron: "0 0 3 * * *"
    auth-patrol-cron: "0 0 8 * * *"
    log-sync-ms: 300000

logging:
  level:
    com.unidelivery: INFO