# 本地开箱profile：H2 文件库（MySQL 模式），无需外部 MySQL 即可启动与演练 REST/SPI。
# 生产请用默认 profile + MySQL（见 docker-compose.yml）。
spring:
  datasource:
    url: jdbc:h2:file:./data/uni_delivery;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

unidelivery:
  jobs:
    enabled: false